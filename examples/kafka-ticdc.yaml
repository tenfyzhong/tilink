version: 1
name: events-ticdc
kind: ticdc
provider: aws
aws:
  profile: customer
  region: ap-northeast-1
  account_id: "123456789012"
  vpc_id: vpc-example
  subnet_ids:
    - subnet-example-a
    - subnet-example-b
tidb:
  project_id: project-id
  cluster_id: cluster-id
  public_key_env: TIDB_PUBLIC_KEY
  private_key_env: TIDB_PRIVATE_KEY
  principal_arn: arn:aws:iam::123456789999:root
  az_ids:
    - apne1-az1
    - apne1-az2
target:
  type: kafka
  host: broker-a.internal.example
  port: 9093
  security_group_id: sg-kafka
  brokers:
    - id: "1"
      host: broker-a.internal.example
      port: 9093
      listener_port: 19093
    - id: "2"
      host: broker-b.internal.example
      port: 9093
      listener_port: 29093
verification:
  username_env: KAFKA_USER
  password_env: KAFKA_PASSWORD
  sasl_mechanism: SCRAM-SHA-512
maintenance: true
probe: true
