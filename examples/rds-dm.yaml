version: 1
name: orders-dm
kind: dm
provider: aws
aws:
  profile: customer
  region: ap-northeast-1
  account_id: "123456789012"
  vpc_id: vpc-example
  subnet_ids:
    - subnet-example-a
    - subnet-example-b
tidb:
  project_id: project-id
  cluster_id: cluster-id
  public_key_env: TIDB_PUBLIC_KEY
  private_key_env: TIDB_PRIVATE_KEY
  principal_arn: arn:aws:iam::123456789999:root
  az_ids:
    - apne1-az1
    - apne1-az2
target:
  type: rds
  host: orders.example.ap-northeast-1.rds.amazonaws.com
  port: 3306
  security_group_id: sg-database
verification:
  username_env: SOURCE_USER
  password_env: SOURCE_PASSWORD
maintenance: true
probe: true
